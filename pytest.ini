[pytest]
DJANGO_SETTINGS_MODULE = KTCProject.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    -v
    --tb=short
markers =
    postgresql: requires PostgreSQL semantics and is excluded from the SQLite suite
    concurrency: exercises concurrent allocation or transaction-isolation behavior
    windows_locking: exercises Windows filesystem locking behavior
    slow: تست‌هایی که زمان بیشتری می‌گیرند
    integration: تست‌های یکپارچه‌سازی
