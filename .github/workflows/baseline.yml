name: Backend baseline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.dev.txt
      - run: python manage.py check --settings=KTCProject.settings_test
      - run: python manage.py makemigrations --check --dry-run --settings=KTCProject.settings_test
      - run: python manage.py migrate --noinput --settings=KTCProject.settings_test
      - run: python -m pytest -q -m "not postgresql and not concurrency"

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: novira_test
          POSTGRES_USER: novira_test
          POSTGRES_PASSWORD: novira_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U novira_test -d novira_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-key-not-for-production
      DJANGO_DEBUG: '0'
      DB_ENGINE: postgres
      POSTGRES_DB: novira_test
      POSTGRES_USER: novira_test
      POSTGRES_PASSWORD: novira_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_CONN_MAX_AGE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.dev.txt
      - run: python -m pip install -r requirements.dev.txt
      - run: python manage.py migrate --noinput
      - run: python -m pytest -q --ds=KTCProject.settings -m "postgresql or concurrency"
